media:
  input: public/images
  output: /images

content:
  - name: pages
    label: Pages
    path: src/content/pages
    type: collection

    filename: "{slug}.md"

    fields:
      - name: title
        label: Title
        type: string

      - name: heroTextLleft
        label: Hero Title
        type: string

      - name: heroTextLleftBttonText
        label: Button Text
        type: text

      - name: heroTextLleftBttonLink
        label: Button Link
        type: string

      - name: heroLeftButtonLink
        label: Button Link
        type: string

      - name: aboutTitle
        label: About Title
        type: string

      - name: aboutContent
        label: About Content
        type: text